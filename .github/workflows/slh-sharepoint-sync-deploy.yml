name: Deploy isolated SLH SharePoint sync Function
on:
  workflow_dispatch:
  push:
    branches: [slh-sharepoint-sync-preflight-20261028]
    paths:
      - 'slh-sharepoint-sync/**'
      - '.github/workflows/slh-sharepoint-sync-deploy.yml'
permissions:
  contents: read
  id-token: write
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Test reconciliation logic
        run: |
          python -m pip install -r slh-sharepoint-sync/requirements.txt pytest
          python -m pytest -q slh-sharepoint-sync/tests
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Configure dedicated Function
        run: |
          az functionapp config appsettings set -g slh-driver-register-sync-rg -n slh-sharepoint-sync-prod --settings \
            KEY_VAULT_URL=https://slhtmskvprod32190.vault.azure.net/ \
            SHAREPOINT_SITE_ID=stuartlyonshaulage.sharepoint.com,e350e872-0b2b-43a1-8569-270045690fa5,b94ef994-16aa-443b-888b-419b014bbd1f \
            VEHICLES_LIST_ID=8d96865a-b7dc-40c0-9947-468542800bd4 \
            TRAILERS_LIST_ID=a2fb1103-b9fe-48a8-90fd-9f6fcdd2d74c \
            DRIVERS_LIST_ID=2b89c3fc-d83e-424b-81b9-8e2546fabb78 \
            SYNC_LOG_LIST_ID=ff965828-ca04-4374-aec9-b8b500e234b1 -o none
      - name: Package and deploy
        run: |
          cd slh-sharepoint-sync
          zip -r ../slh-function.zip function_app.py host.json requirements.txt
          az functionapp deployment source config-zip -g slh-driver-register-sync-rg -n slh-sharepoint-sync-prod --src ../slh-function.zip --build-remote true
      - name: Verify registered functions
        run: |
          az functionapp function list -g slh-driver-register-sync-rg -n slh-sharepoint-sync-prod --query '[].name' -o json
