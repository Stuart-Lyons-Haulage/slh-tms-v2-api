name: Deploy SLH TMS API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: slh-tms-api-production
  cancel-in-progress: true

env:
  EXPECTED_CONTAINERAPP_FQDN: slh-tms-api-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io
  API_HEALTH_URL: https://slh-tms-api-prod.gentlepond-08dba66b.uksouth.azurecontainerapps.io/api/v1/health

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Slh.Tms.Api.csproj && dotnet restore Slh.Tms.Api.Tests/Slh.Tms.Api.Tests.csproj

      - name: Build API
        run: dotnet build Slh.Tms.Api.csproj --configuration Release --no-restore

      - name: Test API
        run: dotnet test Slh.Tms.Api.Tests/Slh.Tms.Api.Tests.csproj --configuration Release --no-restore

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Locate the production Container App and registry
        run: |
          apps=$(az containerapp list --output json)
          matches=$(jq --arg fqdn "$EXPECTED_CONTAINERAPP_FQDN" '[.[] | select(.properties.configuration.ingress.fqdn == $fqdn)]' <<<"$apps")
          match_count=$(jq 'length' <<<"$matches")
          if [[ "$match_count" != "1" ]]; then
            echo "Expected exactly one production Container App for $EXPECTED_CONTAINERAPP_FQDN; found $match_count." >&2
            exit 1
          fi

          app_name=$(jq -r '.[0].name' <<<"$matches")
          resource_group=$(jq -r '.[0].resourceGroup' <<<"$matches")
          current_image=$(jq -r '.[0].properties.template.containers[0].image // empty' <<<"$matches")
          registry_server="${current_image%%/*}"
          if [[ -z "$app_name" || -z "$resource_group" || "$registry_server" != *.azurecr.io ]]; then
            echo "Production app metadata is incomplete or its image is not in Azure Container Registry: $current_image" >&2
            exit 1
          fi

          printf 'AZURE_CONTAINERAPP_NAME=%s\n' "$app_name" >> "$GITHUB_ENV"
          printf 'AZURE_RESOURCE_GROUP=%s\n' "$resource_group" >> "$GITHUB_ENV"
          printf 'ACR_LOGIN_SERVER=%s\n' "$registry_server" >> "$GITHUB_ENV"
          printf 'ACR_NAME=%s\n' "${registry_server%.azurecr.io}" >> "$GITHUB_ENV"

      - name: Build and push immutable API image
        run: |
          az acr login --name "$ACR_NAME"
          docker build --pull --tag "$ACR_LOGIN_SERVER/slh-tms-api:${{ github.sha }}" .
          docker push "$ACR_LOGIN_SERVER/slh-tms-api:${{ github.sha }}"

      - name: Deploy image to Azure Container Apps
        run: |
          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_CONTAINERAPP_NAME" \
            --image "$ACR_LOGIN_SERVER/slh-tms-api:${{ github.sha }}"

      - name: Verify production health and deployed revision
        run: |
          for attempt in {1..18}; do
            response=$(curl -fsS "$API_HEALTH_URL" || true)
            if echo "$response" | grep -qi 'healthy'; then
              echo "$response"
              exit 0
            fi
            sleep 10
          done
          echo "Container App health check failed after deployment" >&2
          exit 1
