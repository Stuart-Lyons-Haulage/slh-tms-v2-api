name: Deploy SLH TMS API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: slh-tms-api-production
  cancel-in-progress: true

env:
  AZURE_WEBAPP_NAME: slh-tms-api-prod
  AZURE_RESOURCE_GROUP: slh-tms-prod-rg
  API_HEALTH_URL: https://slh-tms-api-prod.azurewebsites.net/api/v1/health
  API_READY_URL: https://slh-tms-api-prod.azurewebsites.net/api/v1/health/ready

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Slh.Tms.Api.csproj && dotnet restore Slh.Tms.Api.Tests/Slh.Tms.Api.Tests.csproj

      - name: Build API
        run: dotnet build Slh.Tms.Api.csproj --configuration Release --no-restore

      - name: Test API
        run: dotnet test Slh.Tms.Api.Tests/Slh.Tms.Api.Tests.csproj --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish Slh.Tms.Api.csproj --configuration Release --no-restore --output ./publish

      - name: Package published API
        run: cd publish && zip -r ../api-publish.zip .

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify the production App Service target
        run: |
          host=$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query defaultHostName \
            --output tsv)
          if [[ "$host" != "slh-tms-api-prod.azurewebsites.net" ]]; then
            echo "Unexpected production App Service host: $host" >&2
            exit 1
          fi

      - name: Deploy ZIP to Azure App Service
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp deploy \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_WEBAPP_NAME" \
              --src-path api-publish.zip \
              --type zip \
              --clean true

      - name: Stamp deployed revision
        run: |
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --settings "Deployment__Revision=$GITHUB_SHA" \
            --output none

      - name: Verify deployed revision and SQL readiness
        run: |
          for attempt in {1..18}; do
            response=$(curl -fsS "$API_HEALTH_URL" || true)
            readiness=$(curl -fsS "$API_READY_URL" || true)
            if echo "$response" | grep -qi 'healthy' &&
               echo "$response" | grep -Fq "$GITHUB_SHA" &&
               echo "$readiness" | grep -q 'Healthy'; then
              echo "API health: $response"
              echo "SQL readiness: $readiness"
              exit 0
            fi
            sleep 10
          done
          echo "App Service revision or readiness verification failed after deployment" >&2
          echo "API health: $response" >&2
          echo "SQL readiness: $readiness" >&2
          exit 1
