version: '3.8'

services:
  # SQL Server Database — the application uses EF Core with UseSqlServer, not PostgreSQL.
  # Uses the official Microsoft SQL Server 2022 image for Linux.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: slh-tms-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ChangeMe123!SecurePassword"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools*/bin/sqlcmd -S localhost -U SA -P 'ChangeMe123!SecurePassword' -Q 'SELECT 1' -b || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - slh-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  # C# API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: slh-tms-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TmsDb: "Server=sqlserver,1433;Database=slh_tms_v2;User Id=SA;Password=ChangeMe123!SecurePassword;TrustServerCertificate=True;"
      Entra__TenantId: "your-tenant-id-here"
      Entra__Audience: "api://slh-tms-v2"
      Entra__AllowedDomains__0: "lyonshaulage.com"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      ASPNETCORE_URLS: "http://+:5000"
    ports:
      - "5000:5000"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - slh-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # TypeScript Web Frontend
  web:
    build:
      context: ../slh-tms-v2-web
      dockerfile: Dockerfile
    container_name: slh-tms-web
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: "http://localhost:5000"
    depends_on:
      - api
    networks:
      - slh-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sqlserver_data:
    driver: local

networks:
  slh-network:
    driver: bridge
